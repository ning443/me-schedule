const weekMonday=(week)=>anchor+(week-13)*WEEK_MS;
const dateTitle=(iso)=>{const [y,m,d]=iso.split('-');return `${Number(m)}月${Number(d)}日`};
const dayText=(iso)=>{const [y,m,d]=iso.split('-');return `${y}年${Number(m)}月${Number(d)}日`};
const beijingNow=()=>{
 const values={};
 new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(x=>{if(x.type!=='literal')values[x.type]=x.value});
 const iso=`${values.year}-${values.month}-${values.day}`;
 const day=(new Date(`${iso}T00:00:00Z`).getUTCDay()+6)%7;
 const dateUTC=Date.parse(`${iso}T00:00:00Z`);
 const monday=dateUTC-day*DAY_MS;
 return {iso,day,week:13+Math.round((monday-anchor)/WEEK_MS),time:`${values.hour}:${values.minute}`,timeFull:`${values.hour}:${values.minute}:${values.second}`,dateUTC};
};
const instant=(iso,hm)=>new Date(`${iso}T${hm}:00+08:00`).getTime();
const weekEvents=(week)=>events.filter(e=>e.weeks.includes(week));
const eventStart=(e,w)=>instant(dateAt(w,e.day),e.start);
const eventEnd=(e,w)=>instant(dateAt(w,e.day),e.end);
function upcomingClasses(now){
 const all=[];
 // 一学期中所有教学周，包含所有跨周/单周教学安排
 for(let w=1;w<=20;w++) for(const e of weekEvents(w)){
  const start=eventStart(e,w);if(start>now)all.push({e,w,start});
 }
 return all.sort((a,b)=>a.start-b.start);
}
function currentClasses(now,w){return weekEvents(w).filter(e=>eventStart(e,w)<=now&&now<eventEnd(e,w));}
function relativeDay(target,now){
 const diff=Math.round((Date.parse(`${target}T00:00:00Z`)-now.dateUTC)/DAY_MS);
 if(diff===0)return '今天';if(diff===1)return '明天';if(diff===2)return '后天';return `${dateTitle(target)} · ${weekdays[(new Date(target+'T00:00:00Z').getUTCDay()+6)%7]}`;
}
function remaining(ms){const min=Math.max(0,Math.ceil(ms/60000));if(min<60)return `距离上课还有 ${min} 分钟`;const d=Math.floor(min/1440),h=Math.floor((min%1440)/60),m=min%60;if(d)return `还有 ${d} 天 ${h} 小时`;return `还有 ${h} 小时 ${m} 分钟`}
let selectedWeek=beijingNow().week;
let selectedDay=beijingNow().day;
let view=localStorage.getItem('buptextra-view')==='week'?'week':'day';
let nextOne=null;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSidebar(){
 const bj=beijingNow(),now=Date.now();
 $('clock').innerHTML=`${escapeHTML(bj.time)}<small>北京时间 · ${dateTitle(bj.iso)}</small>`;
 $('currentMiniTime').textContent=bj.time;
 const current=currentClasses(now,bj.week),next=upcomingClasses(now)[0];nextOne=next||null;
 if(next){const e=next.e,when=dateAt(next.w,e.day);
   $('nextName').textContent=e.name;
   $('nextTime').textContent=e.start;
   $('nextDate').textContent=`${relativeDay(when,bj)} · ${weekdays[e.day]} · ${dayText(when)} · ${e.startSlot}-${e.endSlot}节`;
   $('nextInfo').innerHTML=`${escapeHTML(e.location)}<br>${escapeHTML(e.teacher)}${e.note?' · '+escapeHTML(e.note):''}`;
   $('nextCountdown').textContent=remaining(next.start-now);$('jumpNext').style.display='block';
 }else{
   $('nextName').textContent='本学期已无后续课程';$('nextTime').textContent='—';$('nextDate').textContent='接下来可以好好休息';$('nextInfo').textContent='当前课表中没有更晚的课程';$('nextCountdown').textContent='课程已全部结束';$('jumpNext').style.display='none';
 }
 if(current.length){$('currentStatus').innerHTML=`<span class="status-dot live"></span>正在上课：<b>${escapeHTML(current.map(e=>e.name).join('、'))}</b><div style="color:#9ca7b6;font-size:12px;margin-top:5px">${current.map(e=>`${escapeHTML(e.end)} 下课 · ${escapeHTML(e.location)}`).join('<br>')}</div>`}
 else $('currentStatus').innerHTML='<span class="status-dot"></span>当前没有正在进行的课程';
 const today=weekEvents(bj.week).filter(e=>e.day===bj.day).sort((a,b)=>a.startSlot-b.startSlot);
 $('todayCount').textContent=`${today.length} 次`;
 $('todayList').innerHTML=today.length?today.map(e=>`<div class="today-row ${now>=eventStart(e,bj.week)&&now<eventEnd(e,bj.week)?'current':''}"><div class="hour">${escapeHTML(e.start)}</div><div><div class="course">${escapeHTML(e.name)}</div><div class="place">${escapeHTML(e.location)}</div></div></div>`).join(''):'<div class="empty-text">今天没有安排课程</div>';
}
function renderHeader(){
 const inWeek=beijingNow().week;
 const mon=dateAt(selectedWeek,0),sun=dateAt(selectedWeek,6);
 $('weekTitle').textContent=`第 ${selectedWeek} 周课表`;
 $('weekDisplay').textContent=`第 ${selectedWeek} 周`;
 $('weekRange').textContent=`${dayText(mon)} — ${dayText(sun)}${selectedWeek===inWeek?' · 本周':''}`;
 $('prevWeek').disabled=selectedWeek<=1;$('nextWeek').disabled=selectedWeek>=20;
 $('backThisWeek').disabled=selectedWeek===inWeek;
 $('weekBtn').classList.toggle('selected',view==='week');$('dayBtn').classList.toggle('selected',view==='day');
 const list=weekEvents(selectedWeek);$('sumClasses').textContent=list.length;
 $('sumDays').textContent=new Set(list.map(e=>e.day)).size;
 $('sumHours').textContent=list.reduce((v,e)=>v+e.endSlot-e.startSlot+1,0);
}
function colorFor(e){const p=nameColors[e.name]||palette[0];return `--accent:${p[0]};--tint:${p[1]}`;}
function renderWeek(){
 const bj=beijingNow();const list=weekEvents(selectedWeek);
 let header=`<div class="corner">节次</div>`;
 for(let d=0;d<7;d++){const date=dateAt(selectedWeek,d),parts=date.split('-');header+=`<div class="day-header ${date===bj.iso?'today':''}"><span class="weekname">${weekdays[d]}${date===bj.iso?' · 今天':''}</span><span class="date">${Number(parts[2])}<span style="font-size:11px;font-weight:500;color:#a0a9b9;margin-left:2px">日</span></span></div>`}
 let axis='<div class="time-axis">'+slotTimes.map((t,i)=>`<div class="time-cell"><div class="period">第 ${i+1} 节</div><div class="hour">${escapeHTML(t.slice(0,5))}</div></div>`).join('')+'</div>';
 let dayCols='';
 for(let d=0;d<7;d++){
  const dayList=list.filter(e=>e.day===d);
  dayCols+=`<div class="day-lane ${dateAt(selectedWeek,d)===bj.iso?'today':''}">`;
  if(!dayList.length)dayCols+='<span class="lane-empty">—</span>';
  for(const e of dayList){dayCols+=`<button type="button" class="event" style="${colorFor(e)};grid-row:${e.startSlot} / span ${e.endSlot-e.startSlot+1}" data-event="${e.id}" data-week="${selectedWeek}" aria-label="${escapeHTML(e.name)} ${escapeHTML(e.start)}至${escapeHTML(e.end)}"><span class="evname">${escapeHTML(e.name)}</span><span class="evtime">${escapeHTML(e.start)}–${escapeHTML(e.end)}</span><span class="evroom">${escapeHTML(e.location)}</span><span class="evteacher">${escapeHTML(e.teacher)}</span></button>`}
  dayCols+='</div>';
 }
 $('calendarContent').innerHTML=`<div class="week-scroll" id="weekScroll"><div class="week-grid">${header}${axis}${dayCols}</div></div>`;
}
function renderDay(){
 const bj=beijingNow();let choices='<div class="day-pills">';
 for(let d=0;d<7;d++){const date=dateAt(selectedWeek,d);choices+=`<button type="button" class="day-pill ${selectedDay===d?'selected':''}" data-day="${d}">${weekdays[d]}${date===bj.iso?' · 今':''}<b>${Number(date.slice(-2))}</b></button>`}
 choices+='</div>';
 const list=weekEvents(selectedWeek).filter(e=>e.day===selectedDay).sort((a,b)=>a.startSlot-b.startSlot);
 let agenda=`<h3 class="day-title">${weekdays[selectedDay]} · ${dayText(dateAt(selectedWeek,selectedDay))}</h3>`;
 if(!list.length)agenda+='<div class="agenda-empty">这一天没有安排课程，可以自由安排时间。</div>';
 for(const e of list){agenda+=`<div class="agenda-row" style="${colorFor(e)}"><div class="agenda-clock">${e.start}<small>${e.end} 下课</small></div><div class="agenda-line"></div><button type="button" class="agenda-box" data-event="${e.id}" data-week="${selectedWeek}"><div><h4>${escapeHTML(e.name)}</h4><p>${escapeHTML(e.location)} · ${escapeHTML(e.teacher)}</p></div><div style="font-size:18px;color:#aab3c0">›</div></button></div>`}
 $('calendarContent').innerHTML=`<div class="day-mode">${choices}${agenda?'<div class="day-agenda">'+agenda+'</div>':''}</div>`;
}
function renderAll(){renderHeader();if(view==='week')renderWeek();else renderDay();renderSidebar()}
function changeWeek(delta){selectedWeek=Math.min(20,Math.max(1,selectedWeek+delta));selectedDay=selectedWeek===beijingNow().week?beijingNow().day:0;renderAll()}
function jumpTo(event,week){selectedWeek=week;selectedDay=event.day;view='week';localStorage.setItem('buptextra-view',view);renderAll();const target=document.querySelector(`[data-event="${event.id}"][data-week="${week}"]`);if(target){target.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});target.classList.add('focus-flash');setTimeout(()=>target.classList.remove('focus-flash'),2200)}}
function details(event,week){const date=dateAt(week,event.day);$('modalContent').innerHTML=`<h2 class="modal-title">${escapeHTML(event.name)}</h2><div class="detail-row"><label>上课时间</label><div>${escapeHTML(dayText(date))} · ${weekdays[event.day]}<br>${event.start}–${event.end}（第 ${event.startSlot}–${event.endSlot} 节）</div></div><div class="detail-row"><label>上课地点</label><div>${escapeHTML(event.location)}</div></div><div class="detail-row"><label>授课教师</label><div>${escapeHTML(event.teacher)}${event.note?' '+escapeHTML(event.note):''}</div></div><div class="detail-row"><label>上课周次</label><div>${escapeHTML(event.weeksText)}</div></div><div class="modal-foot">课程信息以教务系统最新通知为准，调课需更新课表。</div>`;const dialog=$('courseDialog');if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','')}
$('prevWeek').addEventListener('click',()=>changeWeek(-1));$('nextWeek').addEventListener('click',()=>changeWeek(1));
$('backThisWeek').addEventListener('click',()=>{selectedWeek=beijingNow().week;selectedDay=beijingNow().day;renderAll()});
$('weekBtn').addEventListener('click',()=>{view='week';localStorage.setItem('buptextra-view',view);renderAll()});
$('dayBtn').addEventListener('click',()=>{view='day';selectedDay=selectedWeek===beijingNow().week?beijingNow().day:selectedDay;localStorage.setItem('buptextra-view',view);renderAll()});
$('jumpNext').addEventListener('click',()=>{if(nextOne)jumpTo(nextOne.e,nextOne.w)});
$('calendarContent').addEventListener('click',ev=>{const day=ev.target.closest('[data-day]');if(day){selectedDay=Number(day.dataset.day);renderDay();return}const course=ev.target.closest('[data-event]');if(course){const e=events.find(x=>x.id===course.dataset.event);if(e)details(e,Number(course.dataset.week))}});
$('closeModal').addEventListener('click',()=>$('courseDialog').close());$('courseDialog').addEventListener('click',e=>{if(e.target===$('courseDialog'))$('courseDialog').close()});
document.addEventListener('keydown',e=>{if($('courseDialog').open)return;if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();changeWeek(-1)}else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();changeWeek(1)}});
renderAll();setInterval(renderSidebar,30000);
// 跨周自动更新本周状态及显示，保持已经手动选择的周次。
setInterval(()=>{if(selectedWeek===beijingNow().week)renderHeader()},120000);
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
